name: Build and Release

# Trigger esclusivamente manuale (workflow_dispatch).
# La build gira sempre; la pubblicazione sulla repo pubblica RRLMP-Releases
# è una decisione esplicita separata (input publish_release).
#
# 2026-07-22 — RISTRUTTURATO senza storage artifact in modalità release:
# lo storage artifact GitHub (quota 2GB, ricalcolata ogni 6-12h) bloccava le
# release quando pieno. Ora, con publish_release=true:
#   1. create-release crea la release in BOZZA su RRLMP-Releases (note = changelog);
#   2. ogni job di build carica i propri asset DIRETTAMENTE sulla bozza (gh release upload);
#   3. finalize-release la pubblica solo a build complete (niente release monca
#      visibile all'auto-updater se una piattaforma fallisce).
# Con publish_release=false i job caricano gli artifact come prima (build di test).

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release to Ecosystem-Runtime/RRLMP-Releases after build'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_release == 'true' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # v1.15.10: le note di rilascio = changelog della versione (docs/changelogs/current/<ver>.md)
      # + tabella download. Così il popup di aggiornamento in-app mostra le novità reali,
      # non solo la tabella generica dei file.
      # v1.15.31: note BILINGUI italiano + inglese — dopo l'italiano si accoda
      # <ver>.en.md se presente (stessa scelta di lingue del manuale utente).
      - name: Prepare release notes
        run: |
          NUM="$(node -p "require('./package.json').version")"
          CHANGELOG="docs/changelogs/current/${NUM}.md"
          CHANGELOG_EN="docs/changelogs/current/${NUM}.en.md"
          : > RELEASE_NOTES.md
          if [ -f "$CHANGELOG" ]; then
            cat "$CHANGELOG" >> RELEASE_NOTES.md
            printf '\n\n---\n\n' >> RELEASE_NOTES.md
          fi
          if [ -f "$CHANGELOG_EN" ]; then
            cat "$CHANGELOG_EN" >> RELEASE_NOTES.md
            printf '\n\n---\n\n' >> RELEASE_NOTES.md
          else
            echo "::warning::Manca $CHANGELOG_EN — note di rilascio solo in italiano"
          fi
          printf '### Download\n\n' >> RELEASE_NOTES.md
          printf '%s\n' '| Piattaforma / Platform | File |' '|----------|------|' '| **Windows** | `*.exe` |' '| **macOS** | `*.dmg` |' '| **Linux (AppImage)** | `*.AppImage` |' '| **Linux (deb)** | `*.deb` |' '' >> RELEASE_NOTES.md
          printf '%s\n' '> macOS: build non firmata — al primo avvio tasto destro -> Apri per bypassare Gatekeeper.' '> Aggiornamento automatico su Windows e Linux (AppImage); su macOS e Linux (deb) si apre questa pagina.' '>' '> macOS: unsigned build — on first launch right-click -> Open to bypass Gatekeeper.' '> Automatic updates on Windows and Linux (AppImage); on macOS and Linux (deb) this page opens.' >> RELEASE_NOTES.md
          echo '----- RELEASE_NOTES.md -----'; cat RELEASE_NOTES.md

      - name: Create draft release on RRLMP-Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="Ecosystem-Runtime/RRLMP-Releases"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG già esistente su $REPO: riuso (gli upload usano --clobber)."
          else
            gh release create "$TAG" --repo "$REPO" --draft \
              --title "Runtime Live Machine Pro $TAG" \
              --notes-file RELEASE_NOTES.md
          fi

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload assets to release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" --repo Ecosystem-Runtime/RRLMP-Releases --clobber \
            builds/v*/*.AppImage builds/v*/*.deb builds/v*/latest-linux.yml

      - name: Upload Linux Artifacts (test build)
        if: ${{ github.event.inputs.publish_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            builds/v*/*.AppImage
            builds/v*/*.deb
            builds/v*/latest-linux.yml
          retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" --repo Ecosystem-Runtime/RRLMP-Releases --clobber \
            builds/v*/*.exe builds/v*/*.exe.blockmap builds/v*/latest.yml

      - name: Upload Windows Artifacts (test build)
        if: ${{ github.event.inputs.publish_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            builds/v*/*.exe
            builds/v*/*.exe.blockmap
            builds/v*/latest.yml
          retention-days: 7

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload assets to release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" --repo Ecosystem-Runtime/RRLMP-Releases --clobber \
            builds/v*/*.dmg

      - name: Upload macOS Artifacts (test build)
        if: ${{ github.event.inputs.publish_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            builds/v*/*.dmg
          retention-days: 7

  finalize-release:
    name: Publish to RRLMP-Releases
    runs-on: ubuntu-latest
    needs: [create-release, build-linux, build-windows, build-macos]
    if: ${{ github.event.inputs.publish_release == 'true' }}
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release edit "$TAG" --repo Ecosystem-Runtime/RRLMP-Releases --draft=false --latest
          gh release view "$TAG" --repo Ecosystem-Runtime/RRLMP-Releases
