name: Build and Package RRLMP

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prevent signing errors by explicitly leaving these empty
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          # For macOS notarization skip (if needed by electron-builder)
          APPLE_ID: ""
          APPLE_ID_PASSWORD: ""

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RRLMP-${{ matrix.os }}
          path: builds/v*/**/*
