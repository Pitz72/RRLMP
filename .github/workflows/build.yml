name: Build and Release

# Build e pubblicazione solo manuali (workflow_dispatch). Su pull request verso
# master gira soltanto il job `verify` (typecheck + test): nessuna build e nessuna
# pubblicazione può partire da una PR di terzi (apertura del sorgente, Fase 1).
#
# v1.15.33 (apertura del sorgente, Fase 3): le release si pubblicano su QUESTO
# repository (Pitz72/RRLMP) con il GITHUB_TOKEN integrato — nessun PAT. Il job
# macOS è stato tolto: chi ha un Mac compila dal sorgente (CONTRIBUTING.md).
# La repo ponte Ecosystem-Runtime/RRLMP-Releases non è più toccata dalla CI: la
# release traghetto per le installazioni ≤ 1.15.32 si ricarica lì a mano, con
# gli stessi binari (docs/PIANO-APERTURA.md, Fase 3).
#
# Con publish_release=true:
#   1. create-release crea la release in BOZZA (note = changelog IT + EN);
#   2. ogni job di build carica i propri asset direttamente sulla bozza;
#   3. finalize-release la pubblica solo a build complete (niente release monca
#      visibile all'auto-updater se una piattaforma fallisce).
# Con publish_release=false i job caricano gli artifact (build di test, 7 giorni).

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the release on this repository after build'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
  pull_request:
    branches: [master]

# Minimo privilegio: sola lettura di default. Solo i job che creano, riempiono e
# pubblicano la release si alzano a `contents: write`, e girano solo su dispatch.
permissions:
  contents: read

jobs:
  # Quality gate: typecheck dei quattro progetti TypeScript e suite Vitest. Gira
  # su ogni pull request verso master e prima di ogni build manuale.
  verify:
    name: Verify (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type-check (renderer, main, node, preload)
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.main.json
          npx tsc --noEmit -p tsconfig.node.json
          npx tsc --noEmit -p tsconfig.preload.json

      - name: Test
        run: npx vitest run

  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: [verify]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # Note di rilascio = changelog della versione, italiano (<ver>.md) poi inglese
      # (<ver>.en.md), + tabella download. È il testo che il popup di aggiornamento
      # in-app mostra agli utenti.
      - name: Prepare release notes
        run: |
          NUM="$(node -p "require('./package.json').version")"
          CHANGELOG="docs/changelogs/current/${NUM}.md"
          CHANGELOG_EN="docs/changelogs/current/${NUM}.en.md"
          : > RELEASE_NOTES.md
          if [ -f "$CHANGELOG" ]; then
            cat "$CHANGELOG" >> RELEASE_NOTES.md
            printf '\n\n---\n\n' >> RELEASE_NOTES.md
          fi
          if [ -f "$CHANGELOG_EN" ]; then
            cat "$CHANGELOG_EN" >> RELEASE_NOTES.md
            printf '\n\n---\n\n' >> RELEASE_NOTES.md
          else
            echo "::warning::Manca $CHANGELOG_EN — note di rilascio solo in italiano"
          fi
          printf '### Download\n\n' >> RELEASE_NOTES.md
          printf '%s\n' '| Piattaforma / Platform | File |' '|----------|------|' '| **Windows** | `*.exe` |' '| **Linux (AppImage)** | `*.AppImage` |' '| **Linux (deb)** | `*.deb` |' '' >> RELEASE_NOTES.md
          printf '%s\n' '> Aggiornamento automatico su Windows e Linux (AppImage); con il pacchetto .deb si apre questa pagina. macOS: nessun installer ufficiale, si compila dal sorgente (CONTRIBUTING.md).' '>' '> Automatic updates on Windows and Linux (AppImage); with the .deb package this page opens. macOS: no official installer, build from source (CONTRIBUTING.md).' >> RELEASE_NOTES.md
          echo '----- RELEASE_NOTES.md -----'; cat RELEASE_NOTES.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG già esistente su $REPO: riuso (gli upload usano --clobber)."
          else
            gh release create "$TAG" --repo "$REPO" --draft \
              --target "${{ github.sha }}" \
              --title "Runtime Live Machine Pro $TAG" \
              --notes-file RELEASE_NOTES.md
          fi

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: [verify, create-release]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.verify.result == 'success' && needs.create-release.result != 'failure' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload assets to release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            builds/v*/*.AppImage builds/v*/*.deb builds/v*/latest-linux.yml

      - name: Upload Linux Artifacts (test build)
        if: ${{ github.event.inputs.publish_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            builds/v*/*.AppImage
            builds/v*/*.deb
            builds/v*/latest-linux.yml
          retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [verify, create-release]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.verify.result == 'success' && needs.create-release.result != 'failure' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            builds/v*/*.exe builds/v*/*.exe.blockmap builds/v*/latest.yml

      - name: Upload Windows Artifacts (test build)
        if: ${{ github.event.inputs.publish_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            builds/v*/*.exe
            builds/v*/*.exe.blockmap
            builds/v*/latest.yml
          retention-days: 7

  finalize-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [create-release, build-linux, build-windows]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          gh release view "$TAG" --repo "${{ github.repository }}"
